# Check VMM runtime and service code on native hosted operating systems.
# 在原生托管操作系统检查 VMM 运行时与服务代码。
name: VMM CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Release contract tests
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts/test_release.py scripts/test_install_host_deps.py -v
