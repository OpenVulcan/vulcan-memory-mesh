# OpenAI-compatible example override configuration file.
# OpenAI-compatible 示例覆盖配置文件。
#
# This file is an example template rather than the default project override.
# 本文件是示例模板，而不是项目默认覆盖配置。
#
# Typical usage:
# 典型用法：
# - Copy selected entries into config.yaml or another environment-specific override file.
#   按需将其中的条目复制到 config.yaml 或其他环境专用覆盖文件中。
# - Keep secrets in environment variables instead of replacing placeholders with plaintext values.
#   机密信息应继续保存在环境变量中，不建议直接把占位符替换为明文。
# - Read base.yaml first if you need the full baseline meaning of each field.
#   如果需要理解每个字段的完整底座语义，请先阅读 base.yaml。
# - The runtime also supports google_ai_studio and openrouter, but this file intentionally demonstrates the OpenAI-compatible path only.
#   运行时同时支持 google_ai_studio 与 openrouter，但本文件刻意只展示 OpenAI-compatible 路径。

grpc:
  # Example local listen address used by the OpenAI-compatible deployment template.
  # OpenAI-compatible 部署模板示例中使用的本地监听地址。
  listen_addr: "127.0.0.1:17625"

logging:
  # Example log level for a practical deployment template.
  # 实际部署模板示例中使用的日志级别。
  # Allowed values:
  # 支持取值：
  # - debug: print verbose diagnostics for local debugging.
  # - debug：输出详细诊断日志，适合本地排障。
  # - info: balanced default level for normal runtime operation.
  # - info：默认平衡级别，适合常规运行。
  # - warn or warning: keep warnings and errors only, and warning is accepted as an alias.
  # - warn 或 warning：仅保留警告与错误日志，并且 warning 会作为 warn 的别名被接受。
  # - error: keep only error logs.
  # - error：仅保留错误日志。
  level: "info"

  # Example log format.
  # 示例日志格式。
  # Allowed values:
  # 支持取值：
  # - text: human-readable logs for local development and direct terminal inspection.
  # - text：适合本地开发和终端直接阅读的人类可读日志格式。
  # - json: structured logs for collectors, pipelines, and machine parsing.
  # - json：适合日志采集、流水线处理和机器解析的结构化日志格式。
  format: "text"

  # Example switch for verbose RPC payload debugging.
  # 是否输出详细 RPC 载荷调试信息的示例开关。
  debug_rpc_payloads: true

  # Example switch for protected payload logging.
  # 是否启用受保护载荷日志的示例开关。
  protect_payloads: true

  # Encryption key placeholder for protected payload logging.
  # 受保护载荷日志加密密钥的占位符。
  payload_encryption_key: "${VMM_LOG_PAYLOAD_ENCRYPTION_KEY}"

storage:
  # This example keeps split storage mode so relational and vector services stay separated.
  # 本示例保持 split 存储模式，使关系与向量服务继续分离。
  # Allowed values:
  # 支持取值：
  # - split: relational storage uses sqlite and vector storage uses lancedb.
  # - split：关系存储使用 sqlite，向量存储使用 lancedb。
  # - controller: sqlite and lancedb use one shared local vldb-controller process.
  # - controller：sqlite 与 lancedb 统一经由一个本地 vldb-controller 进程访问。
  # - combined: relational and vector capabilities both use the unified PostgreSQL combined store.
  # - combined：关系与向量能力统一走 PostgreSQL 组合库存储。
  mode: "split"

sqlite:
  # SQLite service endpoint placeholder for split relational storage.
  # split 关系存储使用的 SQLite 服务地址占位符。
  address: "${VMM_SQLITE_ADDRESS}"

lancedb:
  # LanceDB service endpoint placeholder for split vector storage.
  # split 向量存储使用的 LanceDB 服务地址占位符。
  address: "${VMM_LANCEDB_ADDRESS}"

postgres:
  # PostgreSQL connection placeholder kept for deployments that may later switch to combined mode.
  # 为未来可能切换 combined 模式的部署保留的 PostgreSQL 连接占位符。
  dsn: "${VMM_POSTGRES_DSN}"

llm:
  # Example LLM route configured for an OpenAI-compatible endpoint.
  # 针对 OpenAI-compatible 接口配置的示例 LLM 路由。
  routes:
    - # Stable route name for logs and failover tracking.
      # 用于日志与 failover 跟踪的稳定路由名。
      name: "primary-openai"
      # Per-scene route weights. Omitted slots default to 100.
      # 分场景路由权重。未声明的槽位默认都是 100。
      weights:
        precheck_l1: 100
        precheck_l2: 100
        postaction_l1: 100
        postaction_l2: 100
        profile_instruction: 100
        reserve: 100
      # Allowed values:
      # 支持取值：
      # - openai: preferred canonical label for the current OpenAI-compatible adapter.
      # - openai：当前 OpenAI-compatible 适配器的推荐规范名称。
      # - openai_native: accepted alias mapped to the same adapter.
      # - openai_native：会映射到同一适配器的兼容别名。
      # - openai_go: accepted alias mapped to the same adapter.
      # - openai_go：会映射到同一适配器的兼容别名。
      # - google_ai_studio: native Google AI Studio / Gemini API adapter built on google.golang.org/genai.
      # - google_ai_studio：基于 google.golang.org/genai 实现的 Google AI Studio / Gemini API 原生适配器。
      # - openrouter: native OpenRouter SDK adapter supporting chat, embeddings, and rerank.
      # - openrouter：基于 OpenRouter 官方 Go SDK 的原生适配器，可支持 chat、embedding 与 rerank。
      provider: "openai"

      # Base endpoint placeholder for the chat/completions-compatible API.
      # chat/completions-compatible API 的接口根地址占位符。
      # If you switch provider to google_ai_studio, this field may be left empty to use the SDK default Gemini API base URL.
      # 如果把 provider 切到 google_ai_studio，该字段可以留空，直接使用 SDK 默认的 Gemini API 基础地址。
      # If you switch provider to openrouter, this field may be left empty to use https://openrouter.ai/api/v1.
      # 如果把 provider 切到 openrouter，该字段可以留空，直接使用 https://openrouter.ai/api/v1。
      endpoint: "${OPENAI_BASE_URL}"

      # API key pool placeholder.
      # API Key 池占位符。
      api_keys:
        - "${OPENAI_API_KEY}"

      rpm: 0
      tpm: 0
      rpd: 0

      # Active LLM model placeholder.
      # 当前 LLM 模型名占位符。
      model: "${OPENAI_MODEL}"
      # These two fields are ignored when provider=google_ai_studio.
      # 当 provider=google_ai_studio 时，这两个字段会被忽略。
      organization: "${OPENAI_ORGANIZATION}"
      project: "${OPENAI_PROJECT}"

      # Example route-level parameter override.
      # 路由级参数覆盖示例。
      params:
        enable_thinking: false

      # Example model-specific parameter override.
      # 模型级参数覆盖示例。
      model_params:
        "${OPENAI_MODEL}":
          enable_thinking: false

      key_failover:
        # Example key-level failover policy for the LLM route.
        # LLM 路由的 key 级容灾策略示例。
        enabled: true
        # Allowed values:
        # 支持取值：
        # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
        # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
        # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
        # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true

embedding:
  # Example embedding configuration targeting the same OpenAI-compatible family.
  # 指向同一类 OpenAI-compatible 服务的 Embedding 配置示例。
  # Allowed values:
  # 支持取值：
  # - openai: preferred canonical label for the current OpenAI-compatible adapter.
  # - openai：当前 OpenAI-compatible 适配器的推荐规范名称。
  # - openai_native: accepted alias mapped to the same adapter.
  # - openai_native：会映射到同一适配器的兼容别名。
  # - openai_go: accepted alias mapped to the same adapter.
  # - openai_go：会映射到同一适配器的兼容别名。
  # - google_ai_studio: native Google AI Studio / Gemini embedding adapter built on google.golang.org/genai.
  # - google_ai_studio：基于 google.golang.org/genai 实现的 Google AI Studio / Gemini 原生向量适配器。
  # - openrouter: native OpenRouter SDK embedding adapter.
  # - openrouter：基于 OpenRouter 官方 Go SDK 的原生向量适配器。
  provider: "openai"
  # If you switch provider to google_ai_studio, this field may be left empty to use the SDK default Gemini API base URL.
  # 如果把 provider 切到 google_ai_studio，该字段可以留空，直接使用 SDK 默认的 Gemini API 基础地址。
  # If you switch provider to openrouter, this field may be left empty to use https://openrouter.ai/api/v1.
  # 如果把 provider 切到 openrouter，该字段可以留空，直接使用 https://openrouter.ai/api/v1。
  endpoint: "${OPENAI_EMBEDDING_URL}"
  api_keys:
    - "${OPENAI_API_KEY}"
  rpm: 0
  tpm: 0
  rpd: 0
  model: "${OPENAI_EMBEDDING_MODEL}"

  # Embedding dimension must match the backing vector store schema.
  # Embedding 维度必须与底层向量存储 schema 一致。
  # When provider=google_ai_studio, this value is sent as Gemini output_dimensionality and should match a dimension supported by the selected model.
  # 当 provider=google_ai_studio 时，该值会作为 Gemini 的 output_dimensionality 发送，并应与所选模型支持的维度保持一致。
  # When provider=openrouter, this value is sent as embeddings dimensions when the selected model supports it.
  # 当 provider=openrouter 时，若所选模型支持，该值会作为 embeddings dimensions 发送。
  dimension: 1024
  max_batch_size: 10
  # These two fields are ignored when provider=google_ai_studio.
  # 当 provider=google_ai_studio 时，这两个字段会被忽略。
  # They are also ignored when provider=openrouter.
  # 当 provider=openrouter 时也会忽略这两个字段。
  organization: "${OPENAI_ORGANIZATION}"
  project: "${OPENAI_PROJECT}"
  params: {}
  model_params: {}

  key_failover:
    # Example key-level failover policy for embedding requests.
    # Embedding 请求的 key 级容灾策略示例。
    enabled: true
    # Allowed values:
    # 支持取值：
    # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
    # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
    # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
    # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true

rerank:
  # This example keeps rerank disabled until a working endpoint and model are confirmed.
  # 本示例默认关闭 rerank，直到确认可用的接口与模型。
  enabled: false
  top_n: 8

  routes:
    - # Example rerank route using DashScope-compatible settings.
      # 使用 DashScope 风格配置的 rerank 路由示例。
      name: "dashscope-primary"
      priority: 100
      # Currently supported values:
      # 当前支持取值：
      # - dashscope: built-in rerank provider used by the current implementation.
      # - dashscope：当前实现内置支持的 rerank provider。
      # - siliconflow: built-in rerank provider using SiliconFlow's official /v1/rerank API.
      # - siliconflow：当前实现内置支持的硅基流动 rerank provider，走官方 /v1/rerank 接口。
      # - openrouter: native OpenRouter SDK rerank provider using https://openrouter.ai/api/v1 as the API root.
      # - openrouter：基于 OpenRouter 官方 Go SDK 的 rerank provider，使用 https://openrouter.ai/api/v1 作为 API 根地址。
      provider: "dashscope"

      # Example rerank endpoint.
      # rerank 接口地址示例。
      endpoint: "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"

      api_keys:
        - "${OPENAI_API_KEY}"
      rpm: 0
      tpm: 0
      rpd: 0
      model: "qwen3-vl-rerank"
      timeout: "8s"

      key_failover:
        # Example key-level failover policy for rerank requests.
        # rerank 请求的 key 级容灾策略示例。
        enabled: true
        # Allowed values:
        # 支持取值：
        # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
        # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
        # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
        # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true

vector:
  # Placeholder vector backend provider for split-mode deployments.
  # split 模式部署使用的向量后端提供方占位符。
  # Currently supported values:
  # 当前支持取值：
  # - lancedb: use LanceDB as the split-mode vector backend.
  # - lancedb：在 split 模式下使用 LanceDB 作为向量后端。
  provider: "${VMM_VECTOR_PROVIDER}"
