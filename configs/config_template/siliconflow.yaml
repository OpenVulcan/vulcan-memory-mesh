# VMM project override configuration file.
# VMM 项目覆盖配置文件。
#
# This file is the normal override layer on top of base.yaml.
# 本文件是叠加在 base.yaml 之上的常规覆盖层。
#
# Usage guidance:
# 使用建议：
# - Keep only environment-specific or deployment-specific overrides here.
#   这里只保留环境差异项或部署差异项。
# - If one field already works through base.yaml, leave it out here instead of repeating it.
#   如果某个字段沿用 base.yaml 默认值，就不要在这里重复声明。
# - Credentials and external addresses should preferably come from environment variables.
#   凭据和外部服务地址优先通过环境变量注入。
#
# Reading order:
# 阅读顺序：
# 1. Read base.yaml for complete baseline semantics.
#    先阅读 base.yaml，理解完整默认语义。
# 2. Read this file for project-local overrides.
#    再阅读本文件，理解项目本地覆盖项。
x-llm-siliconflow: &llm_siliconflow
  weights:
    precheck_l1: 100
    precheck_l2: 100
    postaction_l1: 100
    postaction_l2: 100
    reserve: 100
  provider: "openai"
  endpoint: "${SILICONFLOW_BASE_URL}"
  api_keys:
    - "${SILICONFLOW_API_KEY}"
  rpm: 1000
  tpm: 50000
  rpd: 0
  params:
    enable_thinking: false
    stream: false
    #response_format: { type: "json_object" }
  key_failover:
    enabled: true
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true
    
x-rerank-siliconflow: &rerank_siliconflow
  priority: 100
  provider: "siliconflow"
  endpoint: "${SILICONFLOW_RERANK_URL}"
  api_keys:
    - "${SILICONFLOW_API_KEY}"
  rpm: 2000
  tpm: 500000
  rpd: 0
  timeout: "8s"
  key_failover:
    enabled: true
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true

grpc:
  # Listen address used by the local runtime in this project setup.
  # 本项目运行时在本地环境下使用的监听地址。
  listen_addr: "127.0.0.1:17625"

logging:
  # Whether local debugging prints more verbose RPC payloads.
  # 本地调试时是否输出更完整的 RPC 载荷。
  debug_rpc_payloads: true

  llm_output_enabled: true

storage:
  # This project overrides the topology to combined, which means relational and vector storage both go through PostgreSQL.
  # 本项目将存储拓扑覆盖为 combined，表示关系与向量能力统一经由 PostgreSQL 组合库存储。
  # Allowed values:
  # 支持取值：
  # - split: relational storage uses sqlite and vector storage uses lancedb.
  # - split：关系存储使用 sqlite，向量存储使用 lancedb。
  # - combined: relational and vector capabilities both use the unified PostgreSQL combined store.
  # - combined：关系与向量能力统一走 PostgreSQL 组合库存储。
  mode: "combined"

sqlite:
  # Placeholder endpoint kept for split-mode switching or local experiments.
  # 为 split 模式切换或本地实验保留的占位地址。
  address: "${VMM_SQLITE_ADDRESS}"

lancedb:
  # Placeholder endpoint kept for split-mode vector storage.
  # 为 split 模式向量存储保留的占位地址。
  address: "${VMM_LANCEDB_ADDRESS}"

postgres:
  # Main PostgreSQL connection string used by the combined storage mode.
  # combined 存储模式实际使用的 PostgreSQL 主连接串。
  dsn: "${VMM_POSTGRES_DSN}"

