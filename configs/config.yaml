grpc:
  listen_addr: "127.0.0.1:17625"
logging:
  debug_rpc_payloads: true
storage:
  mode: "combined"
sqlite:
  address: "${VMM_SQLITE_ADDRESS}"
lancedb:
  address: "${VMM_LANCEDB_ADDRESS}"
postgres:
  dsn: "${VMM_POSTGRES_DSN}"
llm:
  routes:
    - name: "primary-openai"
      priority: 100
      provider: "openai"
      endpoint: "${OPENAI_BASE_URL}"
      api_keys:
        - "${OPENAI_API_KEY}"
      rpm: 0
      tpm: 0
      rpd: 0
      model: "${OPENAI_MODEL}"
      organization: "${OPENAI_ORGANIZATION}"
      project: "${OPENAI_PROJECT}"
      params: {}
      model_params:
        "${OPENAI_MODEL}":
          enable_thinking: false
      key_failover:
        enabled: true
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true
embedding:
  provider: "openai"
  endpoint: "${OPENAI_EMBEDDING_URL}"
  api_keys:
    - "${OPENAI_API_KEY}"
  rpm: 0
  tpm: 0
  rpd: 0
  model: "${OPENAI_EMBEDDING_MODEL}"
  dimension: 1024
  organization: "${OPENAI_ORGANIZATION}"
  project: "${OPENAI_PROJECT}"
  params: {}
  model_params: {}
  key_failover:
    enabled: true
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true
rerank:
  enabled: false
  top_n: 8
  routes:
    - name: "dashscope-primary"
      priority: 100
      provider: "dashscope"
      endpoint: "${OPENAI_RERANK_URL}"
      api_keys:
        - "${OPENAI_API_KEY}"
      rpm: 0
      tpm: 0
      rpd: 0
      model: "${OPENAI_RERANK_MODEL}"
      timeout: "8s"
      key_failover:
        enabled: true
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true
vector:
  provider: "${VMM_VECTOR_PROVIDER}"
