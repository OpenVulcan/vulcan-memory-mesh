# VMM project override configuration file.
# VMM 项目覆盖配置文件。
#
# This file is the normal override layer on top of base.yaml.
# 本文件是叠加在 base.yaml 之上的常规覆盖层。
#
# Usage guidance:
# 使用建议：
# - Keep only environment-specific or deployment-specific overrides here.
#   这里只保留环境差异项或部署差异项。
# - If one field already works through base.yaml, leave it out here instead of repeating it.
#   如果某个字段沿用 base.yaml 默认值，就不要在这里重复声明。
# - Credentials and external addresses should preferably come from environment variables.
#   凭据和外部服务地址优先通过环境变量注入。
#
# Reading order:
# 阅读顺序：
# 1. Read base.yaml for complete baseline semantics.
#    先阅读 base.yaml，理解完整默认语义。
# 2. Read this file for project-local overrides.
#    再阅读本文件，理解项目本地覆盖项。

grpc:
  # Listen address used by the local runtime in this project setup.
  # 本项目运行时在本地环境下使用的监听地址。
  listen_addr: "127.0.0.1:17625"

logging:
  # Whether local debugging prints more verbose RPC payloads.
  # 本地调试时是否输出更完整的 RPC 载荷。
  debug_rpc_payloads: true

storage:
  # This project overrides the topology to combined, which means relational and vector storage both go through PostgreSQL.
  # 本项目将存储拓扑覆盖为 combined，表示关系与向量能力统一经由 PostgreSQL 组合库存储。
  # Allowed values:
  # 支持取值：
  # - split: relational storage uses sqlite and vector storage uses lancedb.
  # - split：关系存储使用 sqlite，向量存储使用 lancedb。
  # - combined: relational and vector capabilities both use the unified PostgreSQL combined store.
  # - combined：关系与向量能力统一走 PostgreSQL 组合库存储。
  mode: "combined"

sqlite:
  # Placeholder endpoint kept for split-mode switching or local experiments.
  # 为 split 模式切换或本地实验保留的占位地址。
  address: "${VMM_SQLITE_ADDRESS}"

lancedb:
  # Placeholder endpoint kept for split-mode vector storage.
  # 为 split 模式向量存储保留的占位地址。
  address: "${VMM_LANCEDB_ADDRESS}"

postgres:
  # Main PostgreSQL connection string used by the combined storage mode.
  # combined 存储模式实际使用的 PostgreSQL 主连接串。
  dsn: "${VMM_POSTGRES_DSN}"

llm:
  # Project-local LLM route overrides.
  # 项目本地使用的 LLM 路由覆盖。
  routes:
    - # Stable route name for logs, failover tracing, and diagnostics.
      # 用于日志、failover 跟踪与排障的稳定路由名。
      name: "primary-openai"

      # Higher-than-default priority for the primary route.
      # 高于默认值的主路由优先级。
      priority: 100

      # Provider used by this route.
      # 当前路由使用的 provider。
      # Allowed values:
      # 支持取值：
      # - openai: preferred canonical label for the current OpenAI-compatible adapter.
      # - openai：当前 OpenAI-compatible 适配器的推荐规范名称。
      # - openai_native: accepted alias mapped to the same adapter.
      # - openai_native：会映射到同一适配器的兼容别名。
      # - openai_go: accepted alias mapped to the same adapter.
      # - openai_go：会映射到同一适配器的兼容别名。
      # - google_ai_studio: native Google AI Studio / Gemini API adapter built on google.golang.org/genai.
      # - google_ai_studio：基于 google.golang.org/genai 实现的 Google AI Studio / Gemini API 原生适配器。
      provider: "openai"

      # Gateway endpoint supplied through environment variables so different environments can reuse the same file.
      # 通过环境变量注入的网关地址，便于不同环境复用同一份文件。
      # If you switch provider to google_ai_studio, this field may be left empty to use the SDK default Gemini API base URL.
      # 如果把 provider 切到 google_ai_studio，该字段可以留空，直接使用 SDK 默认的 Gemini API 基础地址。
      endpoint: "${OPENAI_BASE_URL}"

      # API key pool for the primary route.
      # 主路由使用的 API Key 池。
      api_keys:
        - "${OPENAI_API_KEY}"

      # Leaving quotas at zero means this file does not impose an artificial config-side cap.
      # 保持额度为 0 表示不在配置层额外施加人工限额。
      rpm: 0
      tpm: 0
      rpd: 0

      # Model name controlled by environment variables.
      # 通过环境变量控制的模型名。
      model: "${OPENAI_MODEL}"

      # Optional OpenAI-compatible identity headers.
      # 可选的 OpenAI-compatible 身份头字段。
      # These two fields are ignored when provider=google_ai_studio.
      # 当 provider=google_ai_studio 时，这两个字段会被忽略。
      organization: "${OPENAI_ORGANIZATION}"
      project: "${OPENAI_PROJECT}"

      # Route-level extra parameters.
      # 路由级附加参数。
      params: {}

      # Model-specific parameter overrides keyed by the active model name.
      # 以当前模型名为 key 的模型级参数覆盖。
      model_params:
        "${OPENAI_MODEL}":
          enable_thinking: false

      key_failover:
        # Key-level failover configuration inside the current route.
        # 当前路由内部的 key 级容灾配置。
        enabled: true
        # Allowed values:
        # 支持取值：
        # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
        # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
        # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
        # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true

embedding:
  # Embedding requests use one fixed provider definition.
  # Embedding 请求使用单一固定 provider 定义。
  # Allowed values:
  # 支持取值：
  # - openai: preferred canonical label for the current OpenAI-compatible adapter.
  # - openai：当前 OpenAI-compatible 适配器的推荐规范名称。
  # - openai_native: accepted alias mapped to the same adapter.
  # - openai_native：会映射到同一适配器的兼容别名。
  # - openai_go: accepted alias mapped to the same adapter.
  # - openai_go：会映射到同一适配器的兼容别名。
  # - google_ai_studio: native Google AI Studio / Gemini embedding adapter built on google.golang.org/genai.
  # - google_ai_studio：基于 google.golang.org/genai 实现的 Google AI Studio / Gemini 原生向量适配器。
  provider: "openai"

  # Embedding endpoint supplied through environment variables.
  # 通过环境变量注入的 Embedding 接口地址。
  # If you switch provider to google_ai_studio, this field may be left empty to use the SDK default Gemini API base URL.
  # 如果把 provider 切到 google_ai_studio，该字段可以留空，直接使用 SDK 默认的 Gemini API 基础地址。
  endpoint: "${OPENAI_EMBEDDING_URL}"

  # Embedding API key pool.
  # Embedding 使用的 API Key 池。
  api_keys:
    - "${OPENAI_API_KEY}"

  rpm: 0
  tpm: 0
  rpd: 0

  # Embedding model and dimension used by this deployment.
  # 当前部署使用的 Embedding 模型与维度。
  # For google_ai_studio, dimension is sent as Gemini output_dimensionality and must stay aligned with the vector-store schema.
  # 对 google_ai_studio 来说，dimension 会作为 Gemini 的 output_dimensionality 发送，并且必须继续与向量库存储 schema 对齐。
  model: "${OPENAI_EMBEDDING_MODEL}"
  dimension: 1024

  # These two fields are ignored when provider=google_ai_studio.
  # 当 provider=google_ai_studio 时，这两个字段会被忽略。
  organization: "${OPENAI_ORGANIZATION}"
  project: "${OPENAI_PROJECT}"

  params: {}
  model_params: {}

  key_failover:
    # Key-level failover configuration for embedding requests.
    # Embedding 请求的 key 级容灾配置。
    enabled: true
    # Allowed values:
    # 支持取值：
    # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
    # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
    # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
    # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true

rerank:
  # Reranking stays disabled by default in this project-local override.
  # 在当前项目覆盖里，rerank 默认保持关闭。
  enabled: false

  # Candidate count that would enter reranking once rerank is enabled.
  # 一旦启用 rerank 时会送入的候选数量。
  top_n: 8

  routes:
    - # Stable route name for rerank diagnostics.
      # 用于 rerank 排障的稳定路由名。
      name: "dashscope-primary"
      priority: 100
      # Currently supported values:
      # 当前支持取值：
      # - dashscope: built-in rerank provider used by the current implementation.
      # - dashscope：当前实现内置支持的 rerank provider。
      provider: "dashscope"

      # Environment-controlled rerank endpoint.
      # 通过环境变量控制的 rerank 接口地址。
      endpoint: "${OPENAI_RERANK_URL}"

      api_keys:
        - "${OPENAI_API_KEY}"

      rpm: 0
      tpm: 0
      rpd: 0

      # Environment-controlled rerank model.
      # 通过环境变量控制的 rerank 模型名。
      model: "${OPENAI_RERANK_MODEL}"
      timeout: "8s"

      key_failover:
        # Key-level failover configuration for the rerank route.
        # rerank 路由内部的 key 级容灾配置。
        enabled: true
        # Allowed values:
        # 支持取值：
        # - ordered_failover: keep using the current key order until one key cools down or fails, then move to the next healthy key.
        # - ordered_failover：按既定顺序优先使用当前 key，只有当某个 key 失败或进入冷却时才切到下一个健康 key。
        # - round_robin: rotate the eligible keys in turn so load is spread more evenly.
        # - round_robin：按轮询顺序轮流使用可用 key，让负载分布更均匀。
        policy: "ordered_failover"
        respect_retry_after: true
        rate_limit_cooldown: "5m"
        quota_cooldown: "10m"
        auth_cooldown: "12h"
        probe_after_cooldown: true

vector:
  # Placeholder vector backend provider, mainly relevant when switching back to split mode.
  # 向量后端提供方占位，主要在切回 split 模式时生效。
  # Currently supported values:
  # 当前支持取值：
  # - lancedb: use LanceDB as the split-mode vector backend.
  # - lancedb：在 split 模式下使用 LanceDB 作为向量后端。
  provider: "${VMM_VECTOR_PROVIDER}"
