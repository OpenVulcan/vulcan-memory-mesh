# OpenRouter test override configuration file.
# OpenRouter 测试覆盖配置文件。
#
# This file keeps the project-local runtime overrides and switches only the LLM test routes to OpenRouter.
# 本文件保留项目本地运行覆盖，仅将 LLM 测试路由切换到 OpenRouter。
#
# Bailian embedding and rerank intentionally stay unchanged so existing vector and ranking test data remains stable.
# embedding 与 rerank 有意保持百炼不变，确保现有向量与排序测试数据稳定。

x-llm-openrouter: &llm_openrouter
  # Shared OpenRouter LLM route defaults used by the scene-weighted test routes below.
  # 下方分场景测试路由共用的 OpenRouter LLM 默认配置。
  provider: "openrouter"
  endpoint: "https://openrouter.ai/api/v1"
  api_keys:
    - "${OPENROUTER_KEY}"
  rpm: 0
  tpm: 0
  rpd: 0
  nodes: []
  organization: ""
  project: ""
  params:
    # Disable reasoning for all configured OpenRouter test requests.
    # 为当前 OpenRouter 测试请求统一关闭 reasoning。
    reasoning_effort: "none"
    provider:
      allow_fallbacks: true
  model_params: {}
  key_failover: &ai_key_failover
    enabled: true
    policy: "ordered_failover"
    respect_retry_after: true
    rate_limit_cooldown: "5m"
    quota_cooldown: "10m"
    auth_cooldown: "12h"
    probe_after_cooldown: true

x-rerank-bailian: &rerank_bailian
  # Shared Bailian rerank defaults retained for comparable recall ordering tests.
  # 保留共用百炼 rerank 默认配置，确保召回排序测试可比。
  provider: "dashscope"
  endpoint: "${BAILIAN_RERANK_URL}"
  api_keys:
    - "${BAILIAN_API_KEY}"
  rpm: 5400
  tpm: 5000000000
  rpd: 0
  nodes: []
  timeout: "8s"
  params: {}
  model_params: {}
  key_failover:
    <<: *ai_key_failover

grpc:
  # Listen address used by the local runtime in this project setup.
  # 本项目运行时在本地环境下使用的监听地址。
  listen_addr: "127.0.0.1:17625"

logging:
  # Whether local debugging prints more verbose RPC payloads.
  # 本地调试时是否输出更完整的 RPC 载荷。
  debug_rpc_payloads: true

  # Whether LLM output is logged during local model-routing tests.
  # 本地模型路由测试时是否记录 LLM 输出。
  llm_output_enabled: true

storage:
  # This project override keeps the local combined PostgreSQL topology used by the existing test setup.
  # 本项目覆盖层保留现有测试环境使用的本地 PostgreSQL combined 拓扑。
  mode: "combined"

sqlite:
  # Split-mode SQLite address placeholder kept for test configurations that switch storage.mode back to split.
  # 为切回 split 的测试配置保留 SQLite 地址占位。
  address: "${VMM_SQLITE_ADDRESS}"

  # Split-mode SQLite tokenizer default kept literal because this OpenRouter test file runs in combined mode.
  # split 模式 SQLite 分词器默认值保持字面量，因为当前 OpenRouter 测试文件运行在 combined 模式。
  tokenizer_mode: "jieba"

lancedb:
  # Split-mode LanceDB address placeholder kept for test configurations that switch storage.mode back to split.
  # 为切回 split 的测试配置保留 LanceDB 地址占位。
  address: "${VMM_LANCEDB_ADDRESS}"

postgres:
  # Main PostgreSQL connection string used by the combined storage mode.
  # combined 存储模式实际使用的 PostgreSQL 主连接串。
  dsn: "${VMM_POSTGRES_DSN}"

llm:
  # Project-local OpenRouter LLM test routes.
  # 项目本地 OpenRouter LLM 测试路由。
  routes:
    - <<: *llm_openrouter
      # Qwen flash is preferred for light extraction, first-pass post-action analysis, and profile instruction review.
      # Qwen flash 优先承接轻量提取、PostAction 一层分析与手工画像指令评审。
      name: "openrouter-qwen3.5-flash-main"
      model: "qwen/qwen3.5-flash-02-23"
      weights:
        precheck_l1: 180
        precheck_l2: 80
        postaction_l1: 180
        postaction_l2: 80
        profile_instruction: 180
        reserve: 80

    - <<: *llm_openrouter
      # Qwen plus is reserved for the heavier PostAction L2 review path and kept as a low-priority fallback elsewhere.
      # Qwen plus 主要服务较重的 PostAction L2 评审链路，在其他场景仅作为低权重兜底。
      name: "openrouter-qwen3.6-plus-postaction-l2"
      model: "qwen/qwen3.6-plus"
      weights:
        precheck_l1: 10
        precheck_l2: 10
        postaction_l1: 10
        postaction_l2: 180
        profile_instruction: 10
        reserve: 10

    - <<: *llm_openrouter
      # DeepSeek flash is pinned to Novita and preferred for PreCheck L2 memory review.
      # DeepSeek flash 固定走 Novita，并优先承接 PreCheck L2 记忆评审。
      name: "openrouter-deepseek-v4-flash-novita-precheck-l2"
      model: "deepseek/deepseek-v4-flash"
      weights:
        precheck_l1: 120
        precheck_l2: 180
        postaction_l1: 120
        postaction_l2: 120
        profile_instruction: 120
        reserve: 120
      params:
        reasoning_effort: "none"
        provider:
          only:
            - "novita"
          allow_fallbacks: false

embedding:
  # Bailian embedding stays enabled to keep the existing vector-space contract stable.
  # embedding 保持百炼配置，以维持现有向量空间契约稳定。
  provider: "openai"
  endpoint: "${BAILIAN_BASE_URL}"
  api_keys:
    - "${BAILIAN_API_KEY}"
  rpm: 1800
  tpm: 1200000
  rpd: 0
  nodes: []
  model: "text-embedding-v4"
  dimension: 1024
  max_batch_size: 10
  organization: ""
  project: ""
  params: {}
  model_params: {}
  key_failover:
    <<: *ai_key_failover

rerank:
  # Bailian rerank stays enabled so recall ordering behavior remains aligned with current fixtures.
  # rerank 保持百炼启用状态，确保召回排序行为继续与当前夹具对齐。
  enabled: true
  top_n: 8
  routes:
    - <<: *rerank_bailian
      name: "qwen3-rerank"
      priority: 100
      model: "qwen3-rerank"
    - <<: *rerank_bailian
      name: "qwen3-vl-rerank"
      priority: 90
      model: "qwen3-vl-rerank"
    - <<: *rerank_bailian
      name: "gte-rerank-v2"
      priority: 80
      model: "gte-rerank-v2"

vector:
  # Split-mode vector backend default kept literal because this OpenRouter test file runs in combined mode.
  # split 模式向量后端默认值保持字面量，因为当前 OpenRouter 测试文件运行在 combined 模式。
  provider: "lancedb"

maintenance_tool:
  # Logical batch size used while materializing vector-rebuild snapshots before destructive maintenance rewrites begin.
  # 向量重建在进入破坏性维护写入前，用于准备内存快照的逻辑批次大小。
  vector_rebuild_batch_size: 32

prompts:
  # Prompt bundle selector used by the runtime.
  # 运行时使用的提示词包选择器。
  prompt_language: "default_cn"
