syntax = "proto3";

package vmm.v1;

option go_package = "github.com/openvulcan/vmm/internal/adapters/inbound/grpcapi/proto/v1;vmmv1";

import "google/protobuf/empty.proto";

// VMMService exposes the deterministic hierarchy management surface plus the main PreCheck/PostAction business chain.
// VMMService 用于暴露确定性层级管理接口，以及主业务链路 PreCheck/PostAction。
service VMMService {
  // Healthz reports whether the local gateway process is alive.
  // Healthz 用于报告本地网关进程是否存活。
  rpc Healthz(google.protobuf.Empty) returns (HealthzResponse);

  // ListProjects returns all Team/Space/Project paths in deterministic display order.
  // ListProjects 用于按稳定展示顺序返回全部 Team/Space/Project 路径。
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse);

  // ResolveProject resolves one project by numeric id or canonical Team/Space/Project path.
  // ResolveProject 用于按数字 ID 或标准 Team/Space/Project 路径解析单个项目。
  rpc ResolveProject(ResolveProjectRequest) returns (ResolveProjectResponse);

  // EnsureProject resolves or creates one Team/Space/Project path according to the confirm-create contract.
  // EnsureProject 用于按 confirm_create 规则解析或创建 Team/Space/Project 路径。
  rpc EnsureProject(EnsureProjectRequest) returns (EnsureProjectResponse);

  // DeleteProject deletes one project path and its SQL/vector data after explicit confirmation.
  // DeleteProject 用于在显式确认后删除单个项目路径及其 SQL/向量数据。
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // MigrateProject moves all SQL/vector data from one source project path onto another target project path.
  // MigrateProject 用于把某个源项目路径下的全部 SQL/向量数据迁移到目标项目路径。
  rpc MigrateProject(MigrateProjectRequest) returns (MigrateProjectResponse);

  // ResolveUser resolves one user by numeric id or name, and can optionally create it when confirm_create is true.
  // ResolveUser 用于按数字 ID 或名称解析用户，并在 confirm_create 为真时按需创建用户。
  rpc ResolveUser(ResolveUserRequest) returns (ResolveUserResponse);

  // ListUsers returns the durable user list.
  // ListUsers 用于返回长期用户列表。
  rpc ListUsers(google.protobuf.Empty) returns (ListUsersResponse);

  // DeleteUser removes one user and all SQL/vector data after the caller presents the generated confirmation code.
  // DeleteUser 用于在调用方提交生成的确认码后，删除单个用户及其全部 SQL/向量数据。
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // GetProfileNodes returns only active atomic profile nodes for one requested scope target.
  // GetProfileNodes 用于返回单个目标范围下当前 active 的原子化画像节点。
  rpc GetProfileNodes(GetProfileNodesRequest) returns (GetProfileNodesResponse);

  // GetProfileBundle assembles one deterministic TEAM/SPACE/PROJECT/USER prompt bundle for the requested user/project pair.
  // GetProfileBundle 用于为指定 user/project 组合组装一份确定性的 TEAM/SPACE/PROJECT/USER 提示词 bundle。
  rpc GetProfileBundle(GetProfileBundleRequest) returns (GetProfileBundleResponse);

  // ApplyProfileInstruction accepts one explicit manual profile instruction for one target and persists the reviewed node changes.
  // ApplyProfileInstruction 用于接收单个目标上的显式手工画像指令，并持久化评审后的节点变更。
  rpc ApplyProfileInstruction(ApplyProfileInstructionRequest) returns (ApplyProfileInstructionResponse);

  // SearchMemoryEvents embeds one grouped JSON query payload, searches vector memories inside the resolved scope, and returns hits with turn anchors.
  // SearchMemoryEvents 用于对一组 JSON 查询做向量检索，并返回带 turn 锚点的命中结果。
  rpc SearchMemoryEvents(SearchMemoryEventsRequest) returns (SearchMemoryEventsResponse);

  // GetTurnDetails loads one or more dehydrated turn rows by turn id so callers can inspect the original persisted dialogue payloads.
  // GetTurnDetails 用于按 turn id 读取一条或多条脱水 turn 行，让调用方查看原始持久化对话载荷。
  rpc GetTurnDetails(GetTurnDetailsRequest) returns (GetTurnDetailsResponse);

  // PreCheck validates project_id/user_id through the interceptor and currently returns a deterministic no-injection response.
  // PreCheck 用于通过拦截器校验 project_id/user_id，并在当前阶段返回稳定的“不需要记忆”响应。
  rpc PreCheck(PreCheckRequest) returns (PreCheckResponse);

  // PostAction validates project_id/user_id through the interceptor, logs the payload, and persists the cleaned message sequence asynchronously.
  // PostAction 用于通过拦截器校验 project_id/user_id、打印载荷日志，并异步持久化清洗后的消息序列。
  rpc PostAction(PostActionRequest) returns (PostActionResponse);
}

// HealthzResponse returns the runtime status plus trace metadata.
// HealthzResponse 用于返回运行状态和 trace 元数据。
message HealthzResponse {
  string status = 1;
  string trace_id = 2;
}

// ProjectEntry transports one canonical project node plus its display path.
// ProjectEntry 用于承载一个标准项目节点及其展示路径。
message ProjectEntry {
  uint64 project_id = 1;
  uint64 team_id = 2;
  uint64 space_id = 3;
  string team_name = 4;
  string space_name = 5;
  string project_name = 6;
  string display_path = 7;
}

// UserEntry transports one durable user row.
// UserEntry 用于承载一条长期用户记录。
message UserEntry {
  uint64 user_id = 1;
  string user_name = 2;
}

// ListProjectsResponse returns all projects plus trace metadata.
// ListProjectsResponse 用于返回全部项目和 trace 元数据。
message ListProjectsResponse {
  repeated ProjectEntry projects = 1;
  string trace_id = 2;
}

// ResolveProjectRequest accepts either a numeric project id or one canonical Team/Space/Project path.
// ResolveProjectRequest 用于接收数字 project id，或标准 Team/Space/Project 路径。
message ResolveProjectRequest {
  string project_ref = 1;
}

// ResolveProjectResponse returns the resolved canonical project node and a stable status message.
// ResolveProjectResponse 用于返回解析后的标准项目节点和稳定状态消息。
message ResolveProjectResponse {
  ProjectEntry project = 1;
  string message = 2;
  string trace_id = 3;
}

// EnsureProjectRequest asks the server to resolve or create one canonical Team/Space/Project path.
// EnsureProjectRequest 用于请求服务端解析或创建一个标准 Team/Space/Project 路径。
message EnsureProjectRequest {
  string project_path = 1;
  bool confirm_create = 2;
}

// EnsureProjectResponse returns the project node plus creation/confirmation state.
// EnsureProjectResponse 用于返回项目节点，以及创建或确认状态。
message EnsureProjectResponse {
  ProjectEntry project = 1;
  string message = 2;
  bool exists = 3;
  bool needs_confirm = 4;
  bool created_team = 5;
  bool created_space = 6;
  bool created_project = 7;
  bool missing_team = 8;
  bool missing_space = 9;
  string trace_id = 10;
}

// DeleteProjectRequest identifies the target project path and whether deletion has been explicitly confirmed.
// DeleteProjectRequest 用于标识目标项目路径，以及删除是否已经显式确认。
message DeleteProjectRequest {
  string project_path = 1;
  bool confirm_delete = 2;
}

// DeleteProjectResponse returns deletion counts, confirmation status, and the affected project.
// DeleteProjectResponse 用于返回删除计数、确认状态以及受影响项目。
message DeleteProjectResponse {
  ProjectEntry project = 1;
  string message = 2;
  bool needs_confirm = 3;
  int64 deleted_sessions = 4;
  int64 deleted_messages = 5;
  int64 deleted_memories = 6;
  uint64 deleted_vector_rows = 7;
  string trace_id = 8;
  int64 deleted_projects = 9;
  int64 deleted_spaces = 10;
  int64 deleted_teams = 11;
  int64 deleted_profiles = 12;
}

// MigrateProjectRequest identifies the source and target project paths plus the explicit migration confirmation flag.
// MigrateProjectRequest 用于标识源/目标项目路径，以及显式迁移确认标记。
message MigrateProjectRequest {
  string source_project_path = 1;
  string target_project_path = 2;
  bool confirm_migrate = 3;
}

// MigrateProjectResponse returns migration counts, confirmation status, and both source/target project nodes.
// MigrateProjectResponse 用于返回迁移计数、确认状态，以及源/目标项目节点。
message MigrateProjectResponse {
  ProjectEntry source_project = 1;
  ProjectEntry target_project = 2;
  string message = 3;
  bool needs_confirm = 4;
  int64 migrated_sessions = 5;
  int64 migrated_messages = 6;
  int64 migrated_memories = 7;
  int64 rebuilt_vector_rows = 8;
  string trace_id = 9;
}

// ResolveUserRequest accepts either a numeric user id or a user name and can optionally create a missing user.
// ResolveUserRequest 用于接收数字 user id 或用户名，并在需要时创建缺失用户。
message ResolveUserRequest {
  string user_ref = 1;
  bool confirm_create = 2;
}

// ResolveUserResponse returns the resolved user row and creation/existence status.
// ResolveUserResponse 用于返回解析后的用户记录，以及创建/存在状态。
message ResolveUserResponse {
  UserEntry user = 1;
  string message = 2;
  bool created = 3;
  bool exists = 4;
  string trace_id = 5;
}

// ListUsersResponse returns all durable users plus trace metadata.
// ListUsersResponse 用于返回全部长期用户和 trace 元数据。
message ListUsersResponse {
  repeated UserEntry users = 1;
  string trace_id = 2;
}

// DeleteUserRequest carries the user reference and the generated confirmation code for protected deletion.
// DeleteUserRequest 用于承载用户引用和受保护删除所需的确认码。
message DeleteUserRequest {
  string user_ref = 1;
  string confirmation_code = 2;
}

// DeleteUserResponse returns deletion counts, confirmation state, and the user row involved in the flow.
// DeleteUserResponse 用于返回删除计数、确认状态，以及流程涉及的用户记录。
message DeleteUserResponse {
  UserEntry user = 1;
  string message = 2;
  bool requires_confirmation = 3;
  string confirmation_code = 4;
  int64 deleted_sessions = 5;
  int64 deleted_messages = 6;
  int64 deleted_memories = 7;
  uint64 deleted_vector_rows = 8;
  string trace_id = 9;
  int64 deleted_users = 10;
  int64 deleted_profiles = 11;
}

// ProfileTarget identifies the single scope whose profile nodes should be queried or updated.
// ProfileTarget 用于标识应被查询或更新画像节点的单个目标 scope。
enum ProfileTarget {
  PROFILE_TARGET_UNSPECIFIED = 0;
  PROFILE_TARGET_USER = 1;
  PROFILE_TARGET_PROJECT = 2;
  PROFILE_TARGET_TEAM = 3;
  PROFILE_TARGET_SPACE = 4;
}

// ProfileNodeSourceKind describes where one durable profile node came from.
// ProfileNodeSourceKind 用于描述一条长期画像节点的来源。
enum ProfileNodeSourceKind {
  PROFILE_NODE_SOURCE_KIND_UNSPECIFIED = 0;
  PROFILE_NODE_SOURCE_KIND_TURN_EXTRACT = 1;
  PROFILE_NODE_SOURCE_KIND_MANUAL_INSTRUCTION = 2;
  PROFILE_NODE_SOURCE_KIND_SYSTEM_SEED = 3;
  PROFILE_NODE_SOURCE_KIND_RETAINED_AFTER_USER_DELETE = 4;
}

// ProfileNodeEntry transports one active atomic profile node back to the caller.
// ProfileNodeEntry 用于把一条 active 原子化画像节点返回给调用方。
message ProfileNodeEntry {
  uint64 profile_node_id = 1;
  ProfileTarget target = 2;
  uint64 bind_id = 3;
  string content = 4;
  string priority = 5;
  string level = 6;
  uint32 refresh_weight = 7;
  string profile_date = 8;
  int64 expires_timestamp = 9;
  string level_reason = 10;
  ProfileNodeSourceKind source_kind = 11;
  uint64 source_id = 12;
}

// RetiredProfileNodeEntry transports one retired profile node plus the explicit reason attached during a manual instruction review.
// RetiredProfileNodeEntry 用于承载一条被退役的画像节点，以及手工画像评审附带的明确原因。
message RetiredProfileNodeEntry {
  uint64 profile_node_id = 1;
  string reason = 2;
}

// GetProfileNodesRequest asks the server to return only active atomic profile nodes for one requested target.
// GetProfileNodesRequest 用于请求服务端返回单个目标下当前 active 的原子化画像节点。
message GetProfileNodesRequest {
  ProfileTarget target = 1;
  uint64 user_id = 2;
  uint64 project_id = 3;
  uint32 limit = 4;
}

// GetProfileNodesResponse returns the active profile-node slice for the requested target plus trace metadata.
// GetProfileNodesResponse 用于返回请求目标下的 active 画像节点切片和 trace 元数据。
message GetProfileNodesResponse {
  repeated ProfileNodeEntry nodes = 1;
  string trace_id = 2;
}

// ProfileBundleMode selects whether callers want one combined prompt text or the split TEAM/SPACE/PROJECT/USER sections.
// ProfileBundleMode 用于选择调用方希望返回一段组合提示词，还是拆分后的 TEAM/SPACE/PROJECT/USER 段落。
enum ProfileBundleMode {
  PROFILE_BUNDLE_MODE_UNSPECIFIED = 0;
  PROFILE_BUNDLE_MODE_FULL = 1;
  PROFILE_BUNDLE_MODE_SPLIT = 2;
}

// GetProfileBundleRequest asks the server to assemble one deterministic profile bundle for the current project/user pair.
// GetProfileBundleRequest 用于请求服务端为当前 project/user 组合组装一份确定性的画像 bundle。
message GetProfileBundleRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
  ProfileBundleMode mode = 3;
  optional bool include_explanation = 4;
}

// GetProfileBundleResponse returns both the split scope texts and the optional fully assembled prompt bundle.
// GetProfileBundleResponse 用于返回拆分后的 scope 文本，以及按需提供的完整组合提示词。
message GetProfileBundleResponse {
  ProfileBundleMode mode = 1;
  bool include_explanation = 2;
  string explanation_text = 3;
  string environment_priority_text = 4;
  string combined_text = 5;
  string team_profile = 6;
  string space_profile = 7;
  string project_profile = 8;
  string user_profile = 9;
  string trace_id = 10;
}

// ApplyProfileInstructionRequest carries one explicit natural-language instruction that should update a single profile target.
// ApplyProfileInstructionRequest 用于承载一条显式自然语言画像指令，并更新单个画像目标。
message ApplyProfileInstructionRequest {
  ProfileTarget target = 1;
  uint64 user_id = 2;
  uint64 project_id = 3;
  string instruction = 4;
}

// ApplyProfileInstructionResponse returns the accepted new nodes and retired old nodes after the reviewed manual instruction succeeds.
// ApplyProfileInstructionResponse 用于在手工画像指令评审成功后，返回被接纳的新节点和被退役的旧节点。
message ApplyProfileInstructionResponse {
  uint64 instruction_id = 1;
  repeated ProfileNodeEntry accepted_nodes = 2;
  repeated RetiredProfileNodeEntry retired_nodes = 3;
  string review_reason = 4;
  string trace_id = 5;
}

// SearchMemoryEventsRequest carries one grouped JSON query payload together with the resolved user/project selectors.
// SearchMemoryEventsRequest 用于承载一份分组 JSON 查询载荷，以及解析范围所需的 user/project 选择参数。
message SearchMemoryEventsRequest {
  uint64 user_id = 1;
  uint64 project_id = 2;
  string query_json = 3;
  uint32 top_k = 4;
}

// MemorySearchHit transports one vector-memory hit plus the turn anchor used by later detail lookup RPCs.
// MemorySearchHit 用于承载一条向量记忆命中结果，以及后续详情读取 RPC 使用的 turn 锚点。
message MemorySearchHit {
  string memory_id = 1;
  uint64 turn_id = 2;
  uint64 session_id = 3;
  string content = 4;
  string details = 5;
  int32 category = 6;
  double score = 7;
}

// MemorySearchGroupResult echoes one grouped JSON query item and returns the hit list produced for that item.
// MemorySearchGroupResult 用于原样回显一条分组 JSON 查询项，并返回针对该项生成的命中列表。
message MemorySearchGroupResult {
  uint32 query_index = 1;
  string background = 2;
  string query = 3;
  repeated MemorySearchHit hits = 4;
}

// SearchMemoryEventsResponse returns all grouped vector-search results plus trace metadata.
// SearchMemoryEventsResponse 用于返回全部分组向量检索结果和 trace 元数据。
message SearchMemoryEventsResponse {
  repeated MemorySearchGroupResult results = 1;
  string trace_id = 2;
}

// GetTurnDetailsRequest carries one or more turn ids whose dehydrated payloads should be read back exactly as stored.
// GetTurnDetailsRequest 用于承载一条或多条 turn id，让服务端按原样回读脱水持久化内容。
message GetTurnDetailsRequest {
  repeated uint64 turn_ids = 1;
}

// TurnDetailEntry transports one dehydrated turn row back to the caller for exact-detail inspection.
// TurnDetailEntry 用于把一条脱水 turn 行返回给调用方，供精确查看详情。
message TurnDetailEntry {
  uint64 turn_id = 1;
  uint64 session_id = 2;
  uint64 project_id = 3;
  string dehydrated_content = 4;
  int32 dehydrated_budget = 5;
  int32 extracted_status = 6;
  string details = 7;
  int32 details_budget = 8;
  int64 created_timestamp = 9;
  int64 updated_timestamp = 10;
  string user_content = 11;
  repeated PostActionTimelineItem timeline = 12;
  string assistant_content = 13;
  repeated uint64 previous_turn_ids = 14;
  repeated uint64 next_turn_ids = 15;
}

// GetTurnDetailsResponse returns the requested dehydrated turn rows plus trace metadata.
// GetTurnDetailsResponse 用于返回请求的脱水 turn 行和 trace 元数据。
message GetTurnDetailsResponse {
  repeated TurnDetailEntry turns = 1;
  string trace_id = 2;
}

// PreCheckRequest carries only the numeric project/user ids plus the current user text.
// PreCheckRequest 用于只承载数字 project/user id，以及当前用户文本。
message PreCheckRequest {
  string session_id = 1;
  uint64 user_id = 2;
  uint64 project_id = 3;
  string user_content = 4;
}

// ContextItem transports one assembled context item back to the caller.
// ContextItem 用于把一条组装后的上下文项返回给调用方。
message ContextItem {
  string kind = 1;
  string title = 2;
  string text = 3;
  string source = 4;
  double score = 5;
}

// PreCheckResponse returns the injection decision and assembled context payload.
// PreCheckResponse 用于返回注入决策和组装后的上下文载荷。
message PreCheckResponse {
  bool should_inject = 1;
  string context_text = 2;
  repeated ContextItem context_items = 3;
  bool degraded = 4;
  string trace_id = 5;
}

// PostActionTimelineItem carries one middle timeline node from the text-only contract.
// PostActionTimelineItem 用于承载纯文本契约中的一条中间 timeline 节点。
message PostActionTimelineItem {
  string type = 1;
  string content = 2;
}

// PostActionRequest carries the new text-only post-action payload.
// PostActionRequest 用于承载新的纯文本 post-action 载荷。
message PostActionRequest {
  string session_id = 1;
  uint64 user_id = 2;
  uint64 project_id = 3;
  string user_content = 4;
  string assistant_content = 5;
  repeated PostActionTimelineItem timeline = 6;
}

// PostActionResponse acknowledges whether the request was accepted for background persistence.
// PostActionResponse 用于确认请求是否已被接受并进入后台持久化流程。
message PostActionResponse {
  bool accepted = 1;
  string trace_id = 2;
}
