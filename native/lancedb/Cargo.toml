[package]
name = "vmm-lancedb-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "Apache-2.0"
publish = false

[lib]
name = "vmm_lancedb_native"
crate-type = ["cdylib"]

[dependencies]
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures-util = "0.3.31"
lancedb = { version = "0.39.0", default-features = false, features = ["remote"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
